info:
  name: Create book
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/books
  body:
    type: json
    data: |-
      {
        "title": "Марсианин",
        "author": "Энди Вейр"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
