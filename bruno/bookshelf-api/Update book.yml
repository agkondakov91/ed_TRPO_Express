info:
  name: Update book
  type: http
  seq: 3

http:
  method: PUT
  url: http://localhost:3000/books/1
  body:
    type: json
    data: |-
      {
        "title": "Автостопом по галактике",
        "author": "Дуглас Адамс"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
